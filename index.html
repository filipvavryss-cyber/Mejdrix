<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mejdrix App</title>
<style>
:root{--bg:#f4f2fa;--card:#fff;--text:#1a1530;--muted:#6a6485;--accent:#6d4aff;--accent2:#e04fa0;--line:#e7e3f3;--soft:#efeaff;--ok:#16a34a;--warn:#d97706;--bad:#dc2626;--sh:0 4px 18px rgba(60,40,120,.08);--fs:16px;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#120f1e;--card:#1c1730;--text:#f0ecff;--muted:#a199c2;--line:#30294a;--soft:#2a2248;--sh:none;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#120f1e;--card:#1c1730;--text:#f0ecff;--muted:#a199c2;--line:#30294a;--soft:#2a2248;--sh:none;color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html{scroll-padding-top:env(safe-area-inset-top,0px);font-size:var(--fs);overflow-x:hidden}
body{margin:0;width:100%;overflow-x:hidden;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.55}
svg.i{width:1.15em;height:1.15em;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.2em;flex:none}
.wrap{width:100%;max-width:720px;margin:0 auto;padding:0 16px}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 0 10px}
.prof{display:flex;align-items:center;gap:12px}
.av{width:48px;height:48px;border-radius:50%;object-fit:cover;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:1.2rem;flex:none;border:2px solid var(--card);box-shadow:var(--sh)}
.pn{font-weight:800;font-size:1.05rem;line-height:1.2}
.ps{color:var(--muted);font-size:.8rem}
.bell{position:relative;background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:50%;width:44px;height:44px;padding:0;box-shadow:var(--sh)}
.badge{position:absolute;top:-5px;right:-5px;background:var(--accent2);color:#fff;font-size:.7rem;font-weight:800;min-width:20px;height:20px;border-radius:10px;display:flex;align-items:center;justify-content:center;padding:0 5px}
.hero{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border-radius:22px;padding:24px 22px;box-shadow:var(--sh)}
.hero h1{margin:0;font-size:clamp(1.5rem,5.5vw,2rem);line-height:1.15}
.hero p{margin:6px 0 0;opacity:.92}
nav{display:flex;gap:6px;flex-wrap:wrap;padding:14px 0 6px}
nav a{display:flex;align-items:center;gap:6px;padding:8px 13px;border-radius:999px;color:var(--muted);text-decoration:none;font-weight:600;font-size:.9rem;background:var(--card);border:1px solid var(--line)}
nav a.on{background:var(--accent);color:#fff;border-color:var(--accent)}
main{padding:4px 0 36px}
h2{font-size:1.2rem;margin:18px 0 12px;display:flex;align-items:center;gap:8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;margin-bottom:14px;box-shadow:var(--sh)}
.pad{padding:16px}
.card h3{margin:0 0 4px;font-size:1.05rem}
.card p{margin:4px 0 10px;white-space:pre-wrap;overflow-wrap:anywhere}
.meta{color:var(--muted);font-size:.82rem}
.big{display:block;position:relative;aspect-ratio:16/9;background:#000}
.big img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.play{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:62px;height:44px;border-radius:13px;background:#f00;color:#fff;display:flex;align-items:center;justify-content:center;font-size:1.25rem}
.vrow{display:flex;gap:14px;padding:14px;align-items:flex-start}
.vth{position:relative;width:132px;aspect-ratio:16/9;border-radius:12px;overflow:hidden;background:linear-gradient(135deg,#1f1147,var(--accent));flex:none}
.vth img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .2s}
.vth .play{width:42px;height:30px;border-radius:9px;font-size:.95rem}
.vb{flex:1}
.btn{display:inline-flex;align-items:center;gap:7px;background:var(--soft);color:var(--accent);padding:8px 14px;border-radius:11px;font-weight:700;font-size:.88rem;text-decoration:none;margin:2px 0 8px}

.tag.d{background:#fee2e2;color:var(--bad)}.tag.w{background:#fef3c7;color:var(--warn)}.tag.ok{background:#dcfce7;color:var(--ok)}
.note{padding:14px 16px;border-left:4px solid var(--accent)}
.note.w{border-color:var(--warn)}.note.d{border-color:var(--bad)}.note.ok{border-color:var(--ok)}
.note.new{background:var(--soft)}
.empty{color:var(--muted);text-align:center;padding:30px 10px;background:var(--card);border:1px dashed var(--line);border-radius:18px;margin-bottom:14px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:6px 0 14px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;text-align:center;box-shadow:var(--sh);color:var(--muted);font-size:.88rem}
.stat b{display:block;font-size:1.7rem;color:var(--accent)}
button{font:inherit;cursor:pointer;border:0;border-radius:12px;padding:10px 16px;background:var(--accent);color:#fff;font-weight:700;display:inline-flex;align-items:center;gap:8px;justify-content:center}
button.ghost{background:transparent;color:var(--muted);border:1px solid var(--line)}
button.del{background:var(--bad);padding:6px 12px;font-size:.85rem}
input,textarea,select{font:inherit;width:100%;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--text);margin-bottom:10px}
input[type=file]{padding:8px}
.set{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:14px 0;border-top:1px solid var(--line)}
.set:first-child{border-top:0}
.seg{display:flex;gap:4px;background:var(--soft);padding:4px;border-radius:12px}
.seg button{background:transparent;color:var(--muted);padding:6px 11px;font-size:.84rem}
.seg button.on{background:var(--accent);color:#fff}
.admin{border:2px dashed var(--accent);border-radius:18px;padding:16px;margin-bottom:18px;background:var(--card)}
.admin h3{margin:16px 0 8px}
.msg{font-size:.9rem;color:var(--accent2);min-height:1.3em;margin-top:8px;font-weight:600}
.item{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.pv{width:72px;height:72px;border-radius:50%;object-fit:cover;margin-bottom:10px;display:block}
footer{text-align:center;padding:10px 16px 34px;color:var(--muted);font-size:.85rem}
.lock{max-width:320px;margin:12px auto 0;text-align:left}
@media (max-width:480px){.vrow{flex-direction:column}.vth{width:100%}}
</style>
</head>
<body>
<div class="wrap">
  <div class="bar"><div class="prof" id="prof"></div><button class="bell" id="bell" aria-label="Upozornění"></button></div>
  <section class="hero"><h1 id="h1"></h1><p id="h1p"></p></section>
  <nav id="nav"></nav>
  <main id="app"></main>
</div>
<footer>
  <div>Mejdrix App</div>
  <div id="lockArea"></div>
</footer>

        el("div",{class:"set"},[el("div",{},[el("b",{text:"Velikost textu"}),el("div",{class:"meta",text:"Pro pohodlnější čtení"})]),seg([["s","Malý"],["m","Střední"],["l","Velký"]],set.size,function(v){set.size=v;ss("mx_set",set);render();})]),

  function adminPanel(){

        state.news.unshift({id:Date.now(),title:t.value.trim(),text:x.value.trim(),url:l,img:newsImg,date:today()});newsImg="";save("Novinka přidána.");}}),
      el("h3",{text:"Přidat upozornění"}),nt,nx,ns,
      el("button",{html:ic("plus")+" Přidat upozornění",onclick:function(){
        if(!nt.value.trim()){out.textContent="Zadej nadpis upozornění.";return;}
        state.notes.unshift({id:Date.now(),title:nt.value.trim(),text:nx.value.trim(),type:ns.value,date:today()});save("Upozornění přidáno.");}}),
      el("h3",{text:"Texty aplikace"}),ht,hs,ab,
      el("button",{text:"Uložit texty",onclick:function(){state.hero.title=ht.value.trim()||state.hero.title;state.hero.sub=hs.value.trim();state.about=ab.value.trim();save("Texty uloženy.");}}),
      out,
      state.news.length?el("h3",{text:"Správa novinek"}):null,
      el("div",{},state.news.map(function(n){return el("div",{class:"item"},[el("span",{text:n.title}),el("button",{class:"del",html:ic("trash")+" Smazat",onclick:function(){state.news=state.news.filter(function(q){return q.id!==n.id;});save("Novinka smazána.");}})]);})),
      state.notes.length?el("h3",{text:"Správa upozornění"}):null,
      el("div",{},state.notes.map(function(n){return el("div",{class:"item"},[el("span",{text:n.title}),el("button",{class:"del",html:ic("trash")+" Smazat",onclick:function(){state.notes=state.notes.filter(function(q){return q.id!==n.id;});save("Upozornění smazáno.");}})]);})),
      el("div",{style:"margin-top:16px"},[el("button",{class:"ghost",text:"Odhlásit správce",onclick:function(){admin=false;ss("mx_admin",false);location.hash="#domu";render();}})])
    ]);
  }

  async function save(ok){
    state.rev=(state.rev||0)+1;profPhoto=null;
    ss("mx_draft",state);
    msg=ok+" Uloženo v tomto zařízení.";render();
    try{
      var a=await claude.use("artifact");
      if(!a){msg=ok+" Uloženo v tomto zařízení. Ostatním se ukáže, až změnu uděláš na publikované stránce jako majitel.";render();return;}
      var c=document.documentElement.cloneNode(true);
      ["#app","#nav","#lockArea","#h1","#h1p","#bell","#prof"].forEach(function(s){c.querySelector(s).textContent="";});
      c.removeAttribute("style");c.removeAttribute("data-theme");
      c.querySelector("#state").textContent=JSON.stringify(state).replace(/</g,"\\u003c");
      await a.publish("<!doctype html>\n"+c.outerHTML);
    }catch(e){
      msg=ok+" Uloženo v tomto zařízení, ale zveřejnění se nepovedlo ("+((e&&(e.code||e.message))||"chyba")+").";render();
    }
  }

  function render(){applySet();drawChrome();app.textContent="";app.appendChild(view());}
  document.getElementById("bell").addEventListener("click",function(){location.hash="#upozorneni";});
  window.addEventListener("hashchange",function(){
    if(route()==="upozorneni"){setTimeout(function(){read=state.notes.map(function(n){return n.id;});ss("mx_read",read);drawChrome();},1500);}
    render();window.scrollTo(0,0);
  });
  render();
})();
</script>
</body>
</html>
